- title: RewAdIS Launcher MacOS için yayınlandı!
  message: 'Herkese selamlar!


    RewAdIS Launcher V2 MacOS için an itibariyle yayınlanmıştır!


    Artık MacOS kullanıcıları Steam, Switch ve başka platformlar için sorunsuz bir
    şekilde çevirilerini kurabilecekler.


    Uygulamamızın çıkışıyla birlikte ilk MacOS çevirimiz Röki ücretsiz olarak yayınlanmıştır.


    Önceki duyuruda da belirttiğim üzere uygulama beta aşamasındadır ve bütün çeviriler
    launcher için hazır edilmektedir. Launcher''da hazır olan çevirilerimizi buradan
    ve Launcher''dan duyuracağız.


    Ne oynuyorsanız kaliteli oynamanızı dilerim.'
  date: '2025-12-06'
